stages:
  - verify
  - ai_review
  - build
  - deploy

variables:
  LOCAL_REGISTRY: "127.0.0.1:5050"
  LOCAL_REGISTRY_IMAGE: "127.0.0.1:5050/bonga/frontend"
  IMAGE_TAG: "$LOCAL_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DEPLOY_TAG: "$LOCAL_REGISTRY_IMAGE:main"
  DEPLOY_DIR: "/srv/containers/Bonga"

  VITE_API_BASE_URL: "https://bonga.exirfirm.com/api/v1"
  VITE_API_BASE_URL_V2: "https://bonga.exirfirm.com/api/v2"
  VITE_WEBSOCKET_BASE_URL: "https://bonga.exirfirm.com"
  VITE_SITE_URL: "https://bonga.exirfirm.com"
  SEO_API_BASE_URL: "https://bonga.exirfirm.com/"
  SEO_SITE_URL: "https://bonga.exirfirm.com/"

verify:
  stage: verify
  image: node:22-alpine
  tags:
    - exirmain
  script:
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

pr_agent_review:
  stage: ai_review
  image: docker:28
  tags:
    - exirmain
  needs:
    - verify
  variables:
    GIT_STRATEGY: "none"
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.exirfirm.com"
    GITLAB__AUTH_TYPE: "private_token"
    CONFIG__PUBLISH_OUTPUT: "true"
    CONFIG__PROPAGATE_TOOL_ERRORS: "true"
    OPENAI__API_BASE: "http://127.0.0.1:20128/v1"
    CONFIG__MODEL: "openai/cx/gpt-6.1-sol"
    CONFIG__MODEL_WEAK: "openai/cx/gpt-6.1-sol"
    CONFIG__FALLBACK_MODELS: '["openai/cx/gpt-6.1-sol"]'
    CONFIG__TEMPERATURE: "1"
    CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
    CONFIG__MAX_MODEL_TOKENS: "32000"
    CONFIG__MAX_OUTPUT_TOKENS: "8000"
  before_script: []
  script:
    - test -n "$GITLAB__PERSONAL_ACCESS_TOKEN"
    - test -n "$OPENAI__KEY"
    - docker pull pragent/pr-agent:latest
    - |
      docker run --rm --network host \
        -e CONFIG__GIT_PROVIDER \
        -e GITLAB__URL \
        -e GITLAB__AUTH_TYPE \
        -e GITLAB__PERSONAL_ACCESS_TOKEN \
        -e CONFIG__PUBLISH_OUTPUT \
        -e CONFIG__PROPAGATE_TOOL_ERRORS \
        -e OPENAI__API_BASE \
        -e OPENAI__KEY \
        -e CONFIG__MODEL \
        -e CONFIG__MODEL_WEAK \
        -e CONFIG__FALLBACK_MODELS \
        -e CONFIG__TEMPERATURE \
        -e CONFIG__CUSTOM_MODEL_MAX_TOKENS \
        -e CONFIG__MAX_MODEL_TOKENS \
        -e CONFIG__MAX_OUTPUT_TOKENS \
        pragent/pr-agent:latest \
        --pr_url "$CI_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID" review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  allow_failure: true
  timeout: 15m

build_image:
  stage: build
  image: docker:28
  tags:
    - exirmain
  needs:
    - verify

  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$LOCAL_REGISTRY"

  script:
    - |
      docker build \
        --provenance=false \
        --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
        --build-arg VITE_API_BASE_URL_V2="$VITE_API_BASE_URL_V2" \
        --build-arg VITE_WEBSOCKET_BASE_URL="$VITE_WEBSOCKET_BASE_URL" \
        --build-arg VITE_SITE_URL="$VITE_SITE_URL" \
        --build-arg SEO_API_BASE_URL="$SEO_API_BASE_URL" \
        --build-arg SEO_SITE_URL="$SEO_SITE_URL" \
        -t "$IMAGE_TAG" \
        -t "$DEPLOY_TAG" \
        .
    - docker push "$IMAGE_TAG"
    - docker push "$DEPLOY_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_production:
  stage: deploy
  image: docker:28
  tags:
    - exirmain
  needs:
    - build_image

  resource_group: bonga-production

  environment:
    name: production

  before_script:
    - apk add --no-cache util-linux
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$LOCAL_REGISTRY"

  script:
    - export FRONTEND_IMAGE="$IMAGE_TAG"
    - |
      flock "$DEPLOY_DIR/.deploy.lock" sh -eu -c '
        cd "$DEPLOY_DIR"

        docker compose \
          -f docker-compose.yml \
          -f "$CI_PROJECT_DIR/docker-compose.deploy.yml" \
          pull frontend

        docker compose \
          -f docker-compose.yml \
          -f "$CI_PROJECT_DIR/docker-compose.deploy.yml" \
          up -d --no-deps --no-build frontend

        docker compose \
          -f docker-compose.yml \
          -f "$CI_PROJECT_DIR/docker-compose.deploy.yml" \
          ps frontend
      '

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
