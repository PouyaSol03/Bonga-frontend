map $uri $bonga_x_robots_tag {
  default "";
  ~^/$ "noindex, follow";
  ~^/(login|login-required|account|dashboard|crm|new-ad|chat|notifications|verify|403|preview-ad)(/|$) "noindex, nofollow";
  ~^/support/chat(/|$) "noindex, nofollow";
  ~^/search/filter(/|$) "noindex, follow";
  ~^/consultants/neighborhood(/|$) "noindex, follow";
  ~^/ads/[^/]+/(property-info|equipment-facilities)/?$ "noindex, follow";
}

server {
  listen 80;
  server_name bonga.exirfirm.com;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    font/woff2
    image/svg+xml
    text/css
    text/plain
    text/xml;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bonga.exirfirm.com wss://bonga.exirfirm.com; frame-src 'self' https://neshan.org https://*.neshan.org; form-action 'self'; upgrade-insecure-requests" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header X-Robots-Tag $bonga_x_robots_tag always;

  # The SPA document must be revalidated so deployments are picked up immediately.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location = /robots.txt {
    expires 1h;
    try_files $uri =404;
  }

  location = /llms.txt {
    expires 1h;
    try_files $uri =404;
  }

  location ~ ^/sitemap(?:-[a-z0-9-]+)?\.xml$ {
    expires 1h;
    try_files $uri =404;
  }

  # Vite fingerprints these files, so long-term caching is safe.
  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Fonts and static artwork are stable but are not guaranteed to be fingerprinted.
  location ~* \.(?:svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|otf)$ {
    expires 30d;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
